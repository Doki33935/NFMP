version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fire_postgres
    restart: always
    environment:
      POSTGRES_USER: fire_user
      POSTGRES_PASSWORD: fire_pass
      POSTGRES_DB: fire_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire_backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://fire_user:fire_pass@db:5432/fire_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data: