services:
  db:
    image: postgres:16
    container_name: fire_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire_backend
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/backups

  client-web:
    image: node:20-alpine
    container_name: fire_client_web
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./client-web:/app
      - client_web_node_modules:/app/node_modules

  db-backup:
    image: postgres:16
    container_name: fire_db_backup
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-2592000}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_DIR: /backups
      TZ: ${TZ:-Asia/Yekaterinburg}
    command: sh /scripts/backup-loop.sh
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro

volumes:
  postgres_data:
  client_web_node_modules:
