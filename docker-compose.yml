services:
  db:
    image: postgres:16
    container_name: fire_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-restore:
    image: postgres:16
    container_name: fire_db_restore
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      POSTGRES_HOST: db
    command: sh /scripts/ensure-db-from-backup.sh
    volumes:
      - ./backups:/backups:ro
      - ./scripts/ensure-db-from-backup.sh:/scripts/ensure-db-from-backup.sh:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fire_backend
    restart: always
    depends_on:
      db-restore:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backups:/backups

  client-web:
    image: node:20-alpine
    container_name: fire_client_web
    working_dir: /app
    restart: always
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./client-web:/app
      - client_web_node_modules:/app/node_modules

  db-backup:
    image: postgres:16
    container_name: fire_db_backup
    restart: always
    depends_on:
      db-restore:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      BACKUP_DIR: /backups
      POSTGRES_HOST: db
      TZ: ${TZ:-Asia/Yekaterinburg}
    command: sh /scripts/backup-loop.sh
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro

volumes:
  postgres_data:
  client_web_node_modules:
